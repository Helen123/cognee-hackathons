[project]
name = "memoff"
version = "0.1.0"
description = "Mem Off benchmark harness: agent adapter + eight-issue sequencer on top of the cognee-report outcomes protocol"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memoff = "memoff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memoff*"]

[tool.setuptools.package-data]
memoff = ["data/*.json", "data/*.md"]
